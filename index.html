<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#12101a"><title>人生容错率测试 · Pixel Edition</title><style>:root{--bg:#12101a;--panel:#211d2d;--panel2:#2b2639;--line:#6e6388;--text:#f8f4ff;--muted:#c9bfd9;--pink:#ff8fbd;--cyan:#79d9ff;--green:#8ee3b1;--yellow:#ffd98f;--red:#ff9c9c;--shadow:#09080d}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--text);font-family:"Courier New","PingFang SC","Microsoft YaHei",monospace;background:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px),var(--bg);background-size:16px 16px,16px 16px,auto}button{font:inherit}.app{max-width:920px;margin:0 auto;padding:18px 14px 70px}.screen{display:none}.screen.active{display:block}.box{background:var(--panel);border:4px solid var(--line);box-shadow:8px 8px 0 var(--shadow);padding:20px;margin:16px 0}.hero{text-align:center;padding:28px 20px}.hero h1{margin:0 0 10px;font-size:clamp(27px,6vw,42px);color:var(--pink);text-shadow:3px 3px 0 #000}.hero .sub{color:var(--muted);max-width:680px;margin:0 auto 18px;line-height:1.8}.pixel-icon{width:92px;height:92px;margin:0 auto 18px;display:grid;place-items:center;border:4px solid var(--line);background:var(--panel2);box-shadow:6px 6px 0 var(--shadow);font-size:46px}.chips{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:14px 0 4px}.chip{border:2px solid var(--line);background:var(--panel2);padding:5px 9px;font-size:12px;color:var(--muted)}.btn{border:3px solid var(--line);background:#3a3350;color:var(--text);padding:12px 16px;cursor:pointer;box-shadow:4px 4px 0 var(--shadow);touch-action:manipulation}.btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--shadow)}.btn.primary{background:var(--pink);color:#24101a;border-color:#ffd0e2;font-weight:700}.btn.ghost{background:transparent}.btn.wide{width:100%;font-size:16px;padding:14px 18px}.note{color:var(--muted);font-size:13px;line-height:1.7}.rule{height:4px;background:var(--line);margin:16px 0}.topbar{position:sticky;top:0;z-index:20;background:rgba(18,16,26,.94);backdrop-filter:blur(8px);border-bottom:3px solid var(--line);padding:10px 0;margin:0 -14px}.topbar-inner{max-width:920px;margin:0 auto;padding:0 14px;display:flex;gap:12px;align-items:center}.progress-wrap{flex:1}.progress{height:18px;border:3px solid var(--line);background:#171420;overflow:hidden}.progress>div{height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--pink));transition:.25s width}.progress-label{font-size:12px;color:var(--muted);margin-top:5px}.section-head{display:flex;gap:14px;align-items:flex-start;margin-bottom:12px}.section-badge{min-width:44px;height:44px;display:grid;place-items:center;border:3px solid var(--line);background:var(--panel2);color:var(--yellow);font-weight:700;box-shadow:3px 3px 0 var(--shadow)}.section-title{margin:0;color:var(--cyan);font-size:22px}.section-desc{color:var(--muted);margin:4px 0 0;line-height:1.6}.question{border:3px solid var(--line);background:rgba(255,255,255,.02);padding:15px;margin:12px 0}.qnum{color:var(--yellow);font-weight:700;margin-right:8px}.qtext{line-height:1.7}.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px}.scale button{min-height:48px;border:3px solid var(--line);background:#332d46;color:var(--text);cursor:pointer;box-shadow:2px 2px 0 var(--shadow);touch-action:manipulation}.scale button.active{background:var(--pink);color:#24101a;border-color:#ffd2e4;font-weight:700}.scale-legend{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-top:7px;gap:10px}.footer-nav{display:flex;gap:10px;margin-top:18px}.footer-nav .btn{flex:1}.scenario{border:3px solid var(--line);padding:15px;margin:12px 0;background:rgba(255,255,255,.02)}.scenario h3{color:var(--yellow);margin:0 0 6px;font-size:16px}.scenario p{color:var(--muted);margin:0 0 10px;line-height:1.6}.scenario .opts{display:grid;gap:8px}.scenario .opts button{text-align:left;border:3px solid var(--line);background:#332d46;color:var(--text);padding:11px;cursor:pointer;touch-action:manipulation}.scenario .opts button.active{background:var(--green);color:#102016;border-color:#d6ffe4;font-weight:700}.result-hero{text-align:center}.big-score{font-size:56px;color:var(--pink);font-weight:700;text-shadow:3px 3px 0 #000;line-height:1}.result-title{font-size:22px;color:var(--cyan);margin-top:8px}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px}.card{border:3px solid var(--line);background:var(--panel2);padding:14px}.card .k{color:var(--muted);font-size:12px}.card .v{font-size:19px;color:var(--yellow);font-weight:700;margin-top:4px}.dim{margin:12px 0}.dim-top{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:6px}.dim-name{font-weight:700}.dim-score{color:var(--yellow);white-space:nowrap}.bar{height:14px;border:2px solid var(--line);background:#171420;overflow:hidden}.bar>div{height:100%;background:linear-gradient(90deg,var(--cyan),var(--pink))}canvas{display:block;width:100%;max-width:520px;aspect-ratio:1/1;margin:10px auto 0;image-rendering:pixelated}.analysis-box{border:3px dashed var(--line);background:rgba(255,255,255,.02);padding:14px;line-height:1.8;color:var(--muted)}.analysis-box strong{color:var(--text)}.tag{display:inline-block;border:2px solid var(--line);padding:3px 7px;margin:2px 4px 2px 0;font-size:12px;color:var(--muted)}.warn{color:var(--red)}.good{color:var(--green)}@media(max-width:640px){.cards{grid-template-columns:1fr}.scale{gap:6px}.scale button{min-height:44px}.box{padding:16px}.footer-nav{flex-direction:column}.topbar-inner{align-items:flex-start}}</style></head><body><div class="app"><section id="startScreen" class="screen active"><div class="box hero"><div class="pixel-icon">♥</div><h1>人生容错率测试</h1><div class="sub">不是测“你的人生有多成功”，而是看：当选择失误、收入中断、关系变化或计划崩掉时，你还有多少缓冲、替代路径和重新开始的能力。</div><div class="chips"><span class="chip">48 道核心题</span><span class="chip">8 个维度</span><span class="chip">5 道压力测试</span><span class="chip">自动计分</span><span class="chip">雷达图</span></div></div><div class="box"><h2 style="color:var(--cyan);margin-top:0">怎么玩？</h2><p class="note">按你现在真实的生活状态作答。1 = 完全不符合，5 = 非常符合。第 43—48 题属于反向题，系统会自动换算。</p><div class="rule"></div><p class="note">本测试用于自我观察，不是临床诊断，也不是经心理测量学正式验证的标准量表。真正值得看的不是总分，而是你的最低维度和“单点失效”风险。</p><button id="startBtn" class="btn primary wide" type="button">开始测试 ▶</button></div></section><section id="testScreen" class="screen"><div class="topbar"><div class="topbar-inner"><div class="progress-wrap"><div class="progress"><div id="progressFill"></div></div><div class="progress-label" id="progressLabel">0 / 53</div></div><button id="saveBtn" class="btn ghost" type="button">保存退出</button></div></div><div id="questionHost"></div></section><section id="resultScreen" class="screen"><div class="box result-hero"><div class="big-score" id="bigScore">--</div><div class="result-title" id="resultTitle">--</div><p class="note" id="resultSummary"></p><div class="cards"><div class="card"><div class="k">最低维度</div><div class="v" id="lowestDim">--</div></div><div class="card"><div class="k">最高维度</div><div class="v" id="highestDim">--</div></div></div></div><div class="box"><h2 style="color:var(--cyan);margin-top:0">八维雷达图</h2><canvas id="radar" width="520" height="520"></canvas></div><div class="box"><h2 style="color:var(--cyan);margin-top:0">维度拆解</h2><div id="dimensionBars"></div></div><div class="box"><h2 style="color:var(--cyan);margin-top:0">你的结构怎么理解</h2><div class="analysis-box" id="analysisText"></div></div><div class="box"><h2 style="color:var(--cyan);margin-top:0">现实压力测试</h2><div id="scenarioReview"></div></div><div class="box"><button id="restartBtn" class="btn primary wide" type="button">重新测试</button></div></section></div><script>const sections=[{key:"A",name:"财务缓冲力",desc:"如果人生突然停摆，你有多少时间不用立刻做出糟糕选择。",reverse:false,qs:["如果我明天失去主要收入来源，我仍然可以维持基本生活至少3个月。","我目前没有必须依靠下一笔工资才能偿还的高压力债务。","一笔相当于我一个月收入的突发支出，不会严重打乱我的生活。","即使收入暂时下降，我也有办法明显压缩生活成本。","我的基本生活并不依赖某一个人持续给我提供经济支持。","除了当前工资/主要收入以外，我拥有一定可以调用的储蓄、资产或其他资源。"]},{key:"B",name:"生存结构弹性",desc:"你的生活是不是被固定在一个非常狭窄的结构里。",reverse:false,qs:["如果必须换城市生活，我现实上具有可操作性。","如果收入明显下降，我可以更换住房、消费方式或生活标准，而不会导致生活彻底失序。","我目前没有大量无法退出、无法延期的长期固定支出。","即使某个重要计划失败，我仍然存在至少一条现实可行的替代路线。","我的人生并没有严重依赖某一个公司、某一个城市、某一段关系或某一个人的单点支撑。","我现在做的大多数重大选择，并不是“一旦选错就几乎无法退出”。"]},{key:"C",name:"职业可迁移能力",desc:"离开现在这个位置以后，你还剩下什么。",reverse:false,qs:["我的工作能力中，有一部分可以迁移到其他公司或行业。","如果目前岗位消失，我大致知道自己还可以寻找哪些类型的工作。","我能够清楚说出至少3项自己真正可以在市场上交换价值的能力。","我拥有能够证明自己能力的经历、项目、作品、数据或成果。","我目前仍然在获得新的能力，而不是完全依赖过去已经拥有的东西。","面对行业或岗位变化，我通常能够主动了解新的可能性，而不是只能等待安排。"]},{key:"D",name:"学习与重建能力",desc:"遇到变化时，你能不能重新搭建方法和路径。",reverse:false,qs:["面对一个完全不会的问题，我通常知道怎样把它拆开并逐步学会。","我过去至少有过一次“原来不会，后来自己学会”的重要经历。","当原来的方法失效时，我能够比较快地尝试新的方法。","我愿意承认自己判断错误，而不是为了证明自己没错继续投入。","我能够根据新的信息修改原来的计划。","即使某条道路失败，我相信自己仍有能力重新建立一套新的生活方式。"]},{key:"E",name:"心理恢复力",desc:"受打击之后，你能否逐渐恢复到可运转状态。",reverse:false,qs:["一件坏事发生后，我通常最终能够恢复正常生活节奏。","即使经历失败，我也很少把一次失败直接理解成“我的人生完了”。","在强烈情绪过去以后，我通常能够重新分析事情本身。","我能够区分“这次事情失败了”和“我这个人失败了”。","当事情无法改变时，我最终能够把注意力重新放到还能改变的部分。","我曾经经历过让我非常难受的事情，但后来依然重新建立了生活。"]},{key:"F",name:"社会支持冗余",desc:"真正出事时，你有没有可调用的支持来源。",reverse:false,qs:["如果我突然遇到严重困难，至少有一个人愿意实际帮助我。","我有至少一个可以坦诚讨论重大决定的人。","除了伴侣之外，我还有其他稳定的情感支持来源。","除了父母/家庭之外，我还有其他可以依靠的人际关系。","如果我失业、生病或者经历重大打击，我不会完全独自面对。","我身边至少有一些人能够给我提供不同于我自己的信息、经验或机会。"]},{key:"G",name:"决策可逆性",desc:"高容错的人不一定更会做对决定，但通常更少一次性押上全部筹码。",reverse:false,qs:["面对重大选择时，我通常会给自己保留退出方案。","在没有充分了解一件事情之前，我很少投入自己无法承受失去的资源。","我能够先小规模尝试，再决定是否全面投入。","我做重要决定时，会考虑“如果判断错了，最坏会怎样”。","我会主动避免同时让金钱、工作、关系、住房等多个方面押在同一个选择上。","当一个选择已经明显不合适时，我能够及时止损。"]},{key:"H",name:"现实负担与退出成本",desc:"这一维自动反向计分；分数越高，代表现实负担越轻、退出空间越大。",reverse:true,qs:["有很多人或事情必须依赖我，以至于我很难承担较长时间的收入中断。","我目前存在较大的债务、赡养、医疗、住房或其他刚性压力。","我一旦离开现在的工作/城市/关系，会立刻付出非常高的现实成本。","我现在的人生中存在一个“一旦出问题，其他方面也会一起崩掉”的核心节点。","即使非常不喜欢目前的状态，我也几乎没有条件离开。","未来一两年里，我必须完成一些几乎不能失败的重要目标。"]}];const scenarios=[{key:"S1",title:"突然失业",desc:"假设你明天失去工作，并且3个月找不到同等收入的工作，你的生活会：",opts:{A:"基本不受影响，只需要调整计划",B:"明显受到影响，但可以正常生活",C:"必须大幅削减开支或动用外部帮助",D:"1—2个月内就会产生严重压力",E:"很快出现债务、住房或基本生活问题"}},{key:"S2",title:"重大职业判断错误",desc:"假设你主动换了一份工作，但两个月后发现完全选错，你：",opts:{A:"可以直接退出并重新找",B:"会损失一些钱和时间，但能够退出",C:"会非常纠结，因为退出成本不低",D:"即使不适合也很可能被迫坚持",E:"几乎没有退出条件"}},{key:"S3",title:"重要关系结束",desc:"除了情绪痛苦以外，你的住房、经济、人际关系、生活安排和未来规划中：",opts:{A:"几乎没有其他部分因此崩塌",B:"有部分需要调整",C:"会有多个方面受到明显影响",D:"生活结构会因此发生严重混乱",E:"生活很多部分本身就依赖这段关系"}},{key:"S4",title:"必须换城市",desc:"如果因为工作或其他原因，你必须在三个月内离开现在的城市：",opts:{A:"有很多选择",B:"麻烦，但完全可以操作",C:"需要付出较大成本",D:"非常困难",E:"几乎不可行"}},{key:"S5",title:"过去三年的最大失败",desc:"回忆你过去三年最严重的一次失误、失败或者意外。最终你：",opts:{A:"恢复了，而且获得了新的能力或路径",B:"基本恢复正常",C:"恢复了，但花了非常长时间",D:"到现在仍然明显影响生活",E:"我基本没有经历过真正的失败，因此不知道"}}];let answers={},step=0;const TOTAL=53;function show(id){document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));document.getElementById(id).classList.add("active");window.scrollTo(0,0)}function save(){try{localStorage.setItem("lifeTolerancePixelAnswers",JSON.stringify(answers));localStorage.setItem("lifeTolerancePixelStep",String(step))}catch(e){}}function load(){try{answers=JSON.parse(localStorage.getItem("lifeTolerancePixelAnswers")||"{}");const s=Number(localStorage.getItem("lifeTolerancePixelStep"));if(Number.isFinite(s))step=s}catch(e){answers={};step=0}}function startTest(){load();show("testScreen");renderStep()}function saveAndExit(){save();alert("已保存在这个浏览器里。下次打开可以继续。");show("startScreen")}function answeredCount(){return Object.keys(answers).filter(k=>/^([A-H][1-6]|S[1-5])$/.test(k)).length}function updateProgress(){const n=answeredCount();document.getElementById("progressFill").style.width=n/TOTAL*100+"%";document.getElementById("progressLabel").textContent=`已完成 ${n} / ${TOTAL}`}function renderStep(){const host=document.getElementById("questionHost");if(step<8){const s=sections[step],qStart=step*6+1;host.innerHTML=`<div class="box"><div class="section-head"><div class="section-badge">${s.key}</div><div><h2 class="section-title">${s.name}</h2><p class="section-desc">${s.desc}</p></div></div>${s.reverse?'<span class="tag">自动反向计分</span>':''}</div><div class="box">${s.qs.map((q,i)=>{const id=s.key+(i+1);return `<div class="question"><div class="qtext"><span class="qnum">${qStart+i}.</span>${q}</div><div class="scale">${[1,2,3,4,5].map(v=>`<button type="button" data-q="${id}" data-v="${v}" class="${answers[id]==v?'active':''}">${v}</button>`).join("")}</div><div class="scale-legend"><span>完全不符合</span><span>非常符合</span></div></div>`}).join("")}<div class="footer-nav">${step>0?'<button id="prevBtn" class="btn" type="button">◀ 上一组</button>':''}<button id="nextBtn" class="btn primary" type="button">下一组 ▶</button></div></div>`}else{host.innerHTML=`<div class="box"><div class="section-head"><div class="section-badge">★</div><div><h2 class="section-title">现实压力测试</h2><p class="section-desc">不计入主分，用来检查你的“主观感觉”和现实承压结构是否一致。</p></div></div></div><div class="box">${scenarios.map((s,i)=>`<div class="scenario"><h3>${i+1}. ${s.title}</h3><p>${s.desc}</p><div class="opts">${Object.entries(s.opts).map(([k,t])=>`<button type="button" data-s="${s.key}" data-v="${k}" class="${answers[s.key]==k?'active':''}"><strong>${k}.</strong> ${t}</button>`).join("")}</div></div>`).join("")}<div class="footer-nav"><button id="prevBtn" class="btn" type="button">◀ 上一组</button><button id="finishBtn" class="btn primary" type="button">查看结果 ▶</button></div></div>`}bindDynamic();updateProgress()}function bindDynamic(){document.querySelectorAll("[data-q]").forEach(b=>b.addEventListener("click",()=>{answers[b.dataset.q]=Number(b.dataset.v);save();renderStep()}));document.querySelectorAll("[data-s]").forEach(b=>b.addEventListener("click",()=>{answers[b.dataset.s]=b.dataset.v;save();renderStep()}));const p=document.getElementById("prevBtn");if(p)p.addEventListener("click",()=>{if(step>0){step--;save();renderStep();window.scrollTo(0,0)}});const n=document.getElementById("nextBtn");if(n)n.addEventListener("click",()=>{const s=sections[step];if(s.qs.some((_,i)=>answers[s.key+(i+1)]==null)){alert("这一组还有题没答完。");return}step++;save();renderStep();window.scrollTo(0,0)});const f=document.getElementById("finishBtn");if(f)f.addEventListener("click",finish)}function finish(){for(const s of sections){if(s.qs.some((_,i)=>answers[s.key+(i+1)]==null)){alert("前面的正式题还有未完成项。");return}}showResults()}function dimLevel(s){if(s>=26)return"非常强";if(s>=21)return"较强";if(s>=16)return"中等";if(s>=11)return"偏弱";return"明显脆弱"}function overall(p){if(p>=80)return["高容错结构","一次失误通常不足以击穿你的整个生活系统。你的重点不是继续囤积安全感，而是合理使用已有的试错空间。"];if(p>=65)return["较高容错","整体结构健康，但仍可能存在1—2个明显短板。连续冲击比单一冲击更值得关注。"];if(p>=50)return["中等容错","正常状态下运行没有问题，但比较依赖事情按计划发生。真正要补的是冗余和替代路径。"];if(p>=35)return["低容错结构","现实约束已经比较明显。现阶段更适合降低不可逆性、增加缓冲，而不是把收益最大化放在第一位。"];return["极低容错结构","生活系统本身的缓冲较少。优先建立现金、职业、关系和生活结构上的安全垫。"]}function advice(k){return{A:"优先建立3—6个月基础生活费的现金缓冲，并降低高压力固定支出。",B:"减少单点依赖：不要让工作、城市、关系和住房同时绑在一个选择上。",C:"把能力从“当前岗位”里提炼出来：技能、项目、成果、作品和可迁移经验。",D:"训练问题拆解、快速学习和方案迭代，让“重新开始”变成一项可重复能力。",E:"重点提升受挫后的恢复速度，而不是要求自己永远不崩。",F:"不要只依赖伴侣或家庭，建立至少2—3条不同类型的支持关系。",G:"提高可逆性：小步试错、分阶段投入、预设退出条件、控制最大损失。",H:"先处理刚性负担、债务与不可逆承诺，给自己创造可退出空间。"}[k]}function showResults(){const dims=sections.map(s=>{let score=0;s.qs.forEach((_,i)=>{const raw=Number(answers[s.key+(i+1)]);score+=s.reverse?6-raw:raw});return{key:s.key,name:s.name,score,level:dimLevel(score)}}),total=dims.reduce((a,b)=>a+b.score,0),pct=Math.round(total/240*1000)/10,[title,summary]=overall(pct),asc=[...dims].sort((a,b)=>a.score-b.score),desc=[...dims].sort((a,b)=>b.score-a.score),low=asc[0],high=desc[0],weakest=asc.filter(x=>x.score===low.score);document.getElementById("bigScore").textContent=pct;document.getElementById("resultTitle").textContent=title;document.getElementById("resultSummary").textContent=summary;document.getElementById("lowestDim").textContent=weakest.map(x=>x.name).join("、");document.getElementById("highestDim").textContent=high.name;document.getElementById("dimensionBars").innerHTML=dims.map(d=>`<div class="dim"><div class="dim-top"><div class="dim-name">${d.key}. ${d.name}</div><div class="dim-score">${d.score}/30 · ${d.level}</div></div><div class="bar"><div style="width:${d.score/30*100}%"></div></div></div>`).join("");const scVals=scenarios.map(s=>answers[s.key]).filter(Boolean),fragile=scVals.filter(x=>["C","D","E"].includes(x)).length,mismatch=fragile>=3&&pct>=65;let text=`<strong>你的优先短板：</strong>${weakest.map(x=>x.name).join("、")}。<br><br><strong>最值得先做的一件事：</strong>${advice(low.key)}<br><br><strong>结构判断：</strong>你的最高项是 ${high.name}（${high.score}/30），最低项是 ${low.name}（${low.score}/30）。总分只能说明平均水平，真正决定“出事时会不会连锁坍塌”的，通常是最低项。`;if(mismatch)text+=`<br><br><span class="warn"><strong>额外提示：</strong>主量表分数不低，但压力测试里有较多 C/D/E，说明现实结构可能比主观感觉更脆弱。重点看现金流、固定成本和退出路径。</span>`;else if(fragile<=1)text+=`<br><br><span class="good"><strong>压力测试表现：</strong>现实情境中的退出空间也相对充足，你的主观感受与现实结构基本一致。</span>`;document.getElementById("analysisText").innerHTML=text;document.getElementById("scenarioReview").innerHTML=scenarios.map(s=>{const a=answers[s.key];return `<div class="scenario"><h3>${s.title}</h3><p>${a?`你的选择：<strong>${a}</strong> · ${s.opts[a]}`:"未作答"}</p></div>`}).join("");show("resultScreen");setTimeout(()=>drawRadar(dims),50)}function drawRadar(dims){const c=document.getElementById("radar"),ctx=c.getContext("2d"),W=c.width,H=c.height,cx=W/2,cy=H/2,R=180,N=dims.length;ctx.clearRect(0,0,W,H);ctx.lineWidth=3;ctx.font="16px Courier New";ctx.textAlign="center";ctx.textBaseline="middle";const pt=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/N;return[cx+Math.cos(a)*r,cy+Math.sin(a)*r]};for(let ring=1;ring<=5;ring++){ctx.beginPath();for(let i=0;i<N;i++){const[x,y]=pt(i,R*ring/5);i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.closePath();ctx.strokeStyle="#544a69";ctx.stroke()}for(let i=0;i<N;i++){const[x,y]=pt(i,R);ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(x,y);ctx.strokeStyle="#40384f";ctx.stroke();const[lx,ly]=pt(i,R+42);ctx.fillStyle="#f8f4ff";ctx.fillText(dims[i].key,lx,ly)}ctx.beginPath();dims.forEach((d,i)=>{const[x,y]=pt(i,R*d.score/30);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.closePath();ctx.fillStyle="rgba(255,143,189,.28)";ctx.fill();ctx.strokeStyle="#ff8fbd";ctx.lineWidth=4;ctx.stroke();dims.forEach((d,i)=>{const[x,y]=pt(i,R*d.score/30);ctx.fillStyle="#79d9ff";ctx.fillRect(x-4,y-4,8,8)})}function restart(){if(!confirm("确定清空所有答案并重新测试吗？"))return;answers={};step=0;try{localStorage.removeItem("lifeTolerancePixelAnswers");localStorage.removeItem("lifeTolerancePixelStep")}catch(e){}show("startScreen")}document.getElementById("startBtn").addEventListener("click",startTest);document.getElementById("saveBtn").addEventListener("click",saveAndExit);document.getElementById("restartBtn").addEventListener("click",restart);load();</script></body></html>
