<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>旅行预算与消费记录</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .summary-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .summary-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }

        .summary-card:hover {
            transform: translateY(-5px);
        }

        .summary-card h3 {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 10px;
        }

        .summary-card .amount {
            font-size: 1.8rem;
            font-weight: bold;
            color: #333;
        }

        .summary-card .amount.budget {
            color: #667eea;
        }

        .summary-card .amount.spent {
            color: #e74c3c;
        }

        .summary-card .amount.remaining {
            color: #27ae60;
        }

        .categories-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .category-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .category-header {
            padding: 15px 20px;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .category-header .icon {
            font-size: 1.5rem;
            margin-right: 10px;
        }

        .category-header h3 {
            flex: 1;
        }

        .category-header.transport { background: linear-gradient(135deg, #3498db, #2980b9); }
        .category-header.accommodation { background: linear-gradient(135deg, #9b59b6, #8e44ad); }
        .category-header.food { background: linear-gradient(135deg, #e67e22, #d35400); }
        .category-header.entertainment { background: linear-gradient(135deg, #e74c3c, #c0392b); }
        .category-header.shopping { background: linear-gradient(135deg, #1abc9c, #16a085); }
        .category-header.other { background: linear-gradient(135deg, #95a5a6, #7f8c8d); }

        .category-body {
            padding: 20px;
        }

        .budget-input {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }

        .budget-input label {
            font-weight: 500;
            color: #555;
            margin-right: 10px;
        }

        .budget-input input {
            flex: 1;
            padding: 8px 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        .budget-input input:focus {
            outline: none;
            border-color: #667eea;
        }

        .expense-list {
            max-height: 200px;
            overflow-y: auto;
            margin-bottom: 15px;
        }

        .expense-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 8px;
            margin-bottom: 8px;
        }

        .expense-item .name {
            color: #333;
        }

        .expense-item .amount {
            color: #e74c3c;
            font-weight: 500;
        }

        .expense-item .delete-btn {
            background: none;
            border: none;
            color: #999;
            cursor: pointer;
            padding: 5px;
            margin-left: 10px;
            transition: color 0.3s;
        }

        .expense-item .delete-btn:hover {
            color: #e74c3c;
        }

        .add-expense {
            display: flex;
            gap: 10px;
        }

        .add-expense input {
            flex: 1;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 0.9rem;
        }

        .add-expense input:focus {
            outline: none;
            border-color: #667eea;
        }

        .add-expense button {
            padding: 10px 20px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .add-expense button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .category-stats {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #eee;
            font-size: 0.9rem;
            color: #666;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            margin-top: 10px;
            overflow: hidden;
        }

        .progress-bar .progress {
            height: 100%;
            border-radius: 4px;
            transition: width 0.5s ease;
        }

        .progress-bar .progress.safe { background: linear-gradient(90deg, #27ae60, #2ecc71); }
        .progress-bar .progress.warning { background: linear-gradient(90deg, #f39c12, #e67e22); }
        .progress-bar .progress.danger { background: linear-gradient(90deg, #e74c3c, #c0392b); }

        .ai-analysis {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .ai-analysis h2 {
            display: flex;
            align-items: center;
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5rem;
        }

        .ai-analysis h2 .ai-icon {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
            font-size: 1.2rem;
        }

        .analysis-content {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .analysis-section {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
        }

        .analysis-section h4 {
            color: #555;
            margin-bottom: 15px;
            font-size: 1rem;
        }

        .analysis-section p {
            color: #666;
            line-height: 1.6;
        }

        .chart-container {
            grid-column: 1 / -1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .pie-chart {
            position: relative;
            width: 250px;
            height: 250px;
        }

        .pie-chart canvas {
            width: 100%;
            height: 100%;
        }

        .chart-legend {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-left: 30px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .legend-color {
            width: 16px;
            height: 16px;
            border-radius: 4px;
        }

        .legend-text {
            color: #555;
            font-size: 0.9rem;
        }

        .tips-list {
            list-style: none;
        }

        .tips-list li {
            padding: 10px 0;
            border-bottom: 1px solid #e0e0e0;
            color: #555;
            display: flex;
            align-items: flex-start;
        }

        .tips-list li:last-child {
            border-bottom: none;
        }

        .tips-list li::before {
            content: "💡";
            margin-right: 10px;
        }

        .empty-state {
            text-align: center;
            padding: 30px;
            color: #999;
        }

        .empty-state .icon {
            font-size: 3rem;
            margin-bottom: 15px;
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 1.8rem;
            }

            .categories-grid {
                grid-template-columns: 1fr;
            }

            .chart-container {
                flex-direction: column;
            }

            .chart-legend {
                margin-left: 0;
                margin-top: 20px;
                justify-content: center;
            }
        }

        .fade-in {
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>✈️ 旅行预算与消费记录</h1>
            <p>合理规划，快乐旅行</p>
        </header>

        <div class="summary-cards">
            <div class="summary-card">
                <h3>总预算</h3>
                <div class="amount budget" id="totalBudget">¥0</div>
            </div>
            <div class="summary-card">
                <h3>已消费</h3>
                <div class="amount spent" id="totalSpent">¥0</div>
            </div>
            <div class="summary-card">
                <h3>剩余预算</h3>
                <div class="amount remaining" id="totalRemaining">¥0</div>
            </div>
        </div>

        <div class="categories-grid" id="categoriesGrid"></div>

        <div class="ai-analysis">
            <h2>
                <span class="ai-icon">🤖</span>
                AI 消费分析
            </h2>
            <div class="analysis-content" id="analysisContent">
                <div class="empty-state">
                    <div class="icon">📊</div>
                    <p>添加预算和消费记录后，AI将为您生成智能分析</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const categories = [
            { id: 'transport', name: '交通', icon: '🚗', color: '#3498db' },
            { id: 'accommodation', name: '住宿', icon: '🏨', color: '#9b59b6' },
            { id: 'food', name: '饮食', icon: '🍽️', color: '#e67e22' },
            { id: 'entertainment', name: '娱乐', icon: '🎢', color: '#e74c3c' },
            { id: 'shopping', name: '购物', icon: '🛍️', color: '#1abc9c' },
            { id: 'other', name: '其他', icon: '📦', color: '#95a5a6' }
        ];

        let data = {};

        function initData() {
            const savedData = localStorage.getItem('travelBudgetData');
            if (savedData) {
                data = JSON.parse(savedData);
            } else {
                categories.forEach(cat => {
                    data[cat.id] = {
                        budget: 0,
                        expenses: []
                    };
                });
            }
        }

        function saveData() {
            localStorage.setItem('travelBudgetData', JSON.stringify(data));
        }

        function formatCurrency(amount) {
            return '¥' + amount.toFixed(2);
        }

        function renderCategories() {
            const grid = document.getElementById('categoriesGrid');
            grid.innerHTML = categories.map(cat => {
                const catData = data[cat.id];
                const spent = catData.expenses.reduce((sum, e) => sum + e.amount, 0);
                const percentage = catData.budget > 0 ? Math.min((spent / catData.budget) * 100, 100) : 0;
                const progressClass = percentage < 70 ? 'safe' : percentage < 90 ? 'warning' : 'danger';

                return `
                    <div class="category-card fade-in">
                        <div class="category-header ${cat.id}">
                            <span class="icon">${cat.icon}</span>
                            <h3>${cat.name}</h3>
                        </div>
                        <div class="category-body">
                            <div class="budget-input">
                                <label>预算:</label>
                                <input type="number" 
                                       placeholder="输入预算金额" 
                                       value="${catData.budget || ''}"
                                       onchange="updateBudget('${cat.id}', this.value)">
                            </div>
                            <div class="expense-list" id="expenseList-${cat.id}">
                                ${catData.expenses.length > 0 ? catData.expenses.map((e, idx) => `
                                    <div class="expense-item fade-in">
                                        <span class="name">${e.name}</span>
                                        <div>
                                            <span class="amount">${formatCurrency(e.amount)}</span>
                                            <button class="delete-btn" onclick="deleteExpense('${cat.id}', ${idx})">✕</button>
                                        </div>
                                    </div>
                                `).join('') : '<div class="empty-state" style="padding: 20px; font-size: 0.9rem;">暂无消费记录</div>'}
                            </div>
                            <div class="add-expense">
                                <input type="text" placeholder="消费名称" id="expenseName-${cat.id}">
                                <input type="number" placeholder="金额" id="expenseAmount-${cat.id}" style="width: 100px;">
                                <button onclick="addExpense('${cat.id}')">添加</button>
                            </div>
                            <div class="category-stats">
                                <span>已消费: ${formatCurrency(spent)}</span>
                                <span>预算: ${formatCurrency(catData.budget)}</span>
                            </div>
                            <div class="progress-bar">
                                <div class="progress ${progressClass}" style="width: ${percentage}%"></div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function updateBudget(categoryId, value) {
            data[categoryId].budget = parseFloat(value) || 0;
            saveData();
            updateSummary();
            renderAnalysis();
        }

        function addExpense(categoryId) {
            const nameInput = document.getElementById(`expenseName-${categoryId}`);
            const amountInput = document.getElementById(`expenseAmount-${categoryId}`);
            const name = nameInput.value.trim();
            const amount = parseFloat(amountInput.value);

            if (!name || !amount || amount <= 0) {
                alert('请输入有效的消费名称和金额');
                return;
            }

            data[categoryId].expenses.push({ name, amount });
            saveData();
            nameInput.value = '';
            amountInput.value = '';
            renderCategories();
            updateSummary();
            renderAnalysis();
        }

        function deleteExpense(categoryId, index) {
            data[categoryId].expenses.splice(index, 1);
            saveData();
            renderCategories();
            updateSummary();
            renderAnalysis();
        }

        function updateSummary() {
            let totalBudget = 0;
            let totalSpent = 0;

            categories.forEach(cat => {
                totalBudget += data[cat.id].budget;
                totalSpent += data[cat.id].expenses.reduce((sum, e) => sum + e.amount, 0);
            });

            document.getElementById('totalBudget').textContent = formatCurrency(totalBudget);
            document.getElementById('totalSpent').textContent = formatCurrency(totalSpent);
            document.getElementById('totalRemaining').textContent = formatCurrency(totalBudget - totalSpent);
        }

        function renderAnalysis() {
            const content = document.getElementById('analysisContent');
            let totalBudget = 0;
            let totalSpent = 0;
            const categoryStats = [];

            categories.forEach(cat => {
                const budget = data[cat.id].budget;
                const spent = data[cat.id].expenses.reduce((sum, e) => sum + e.amount, 0);
                totalBudget += budget;
                totalSpent += spent;
                categoryStats.push({
                    name: cat.name,
                    icon: cat.icon,
                    budget,
                    spent,
                    color: cat.color
                });
            });

            if (totalBudget === 0 && totalSpent === 0) {
                content.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">📊</div>
                        <p>添加预算和消费记录后，AI将为您生成智能分析</p>
                    </div>
                `;
                return;
            }

            const remaining = totalBudget - totalSpent;
            const usageRate = totalBudget > 0 ? (totalSpent / totalBudget * 100).toFixed(1) : 0;

            const sortedBySpent = [...categoryStats].filter(c => c.spent > 0).sort((a, b) => b.spent - a.spent);
            const topCategory = sortedBySpent[0];

            const overBudgetCategories = categoryStats.filter(c => c.budget > 0 && c.spent > c.budget);
            const nearBudgetCategories = categoryStats.filter(c => c.budget > 0 && c.spent > c.budget * 0.8 && c.spent <= c.budget);

            let analysis = generateAIAnalysis(totalBudget, totalSpent, remaining, usageRate, topCategory, overBudgetCategories, nearBudgetCategories, categoryStats);
            
            content.innerHTML = analysis;
            drawPieChart(categoryStats);
        }

        function generateAIAnalysis(totalBudget, totalSpent, remaining, usageRate, topCategory, overBudgetCategories, nearBudgetCategories, categoryStats) {
            let budgetStatus = '';
            if (totalBudget === 0) {
                budgetStatus = '您还没有设置预算，建议先为各项消费设置预算以便更好地控制支出。';
            } else if (remaining > 0) {
                budgetStatus = `您的预算使用率为 ${usageRate}%，目前剩余 ${formatCurrency(remaining)}，预算控制良好！`;
            } else if (remaining === 0) {
                budgetStatus = `您的预算已用完，使用率正好为100%，建议适当控制后续支出。`;
            } else {
                budgetStatus = `您的消费已超出预算 ${formatCurrency(Math.abs(remaining))}，建议立即调整消费计划。`;
            }

            let tips = [];
            
            if (overBudgetCategories.length > 0) {
                tips.push(`${overBudgetCategories.map(c => c.name).join('、')} 类别已超出预算，请重点关注。`);
            }
            
            if (nearBudgetCategories.length > 0) {
                tips.push(`${nearBudgetCategories.map(c => c.name).join('、')} 类别接近预算上限，建议谨慎消费。`);
            }

            if (topCategory) {
                tips.push(`消费最多的是 ${topCategory.name}，占比 ${(topCategory.spent / totalSpent * 100).toFixed(1)}%。`);
            }

            const lowSpentCategories = categoryStats.filter(c => c.budget > 0 && c.spent < c.budget * 0.3);
            if (lowSpentCategories.length > 0) {
                tips.push(`${lowSpentCategories.map(c => c.name).join('、')} 类别消费较少，如有需要可以适当增加。`);
            }

            if (remaining > totalBudget * 0.3) {
                tips.push('预算结余较多，可以考虑增加一些娱乐或购物体验，让旅行更加丰富！');
            }

            if (tips.length === 0) {
                tips.push('继续保持良好的消费习惯，祝您旅途愉快！');
            }

            return `
                <div class="analysis-section">
                    <h4>📈 预算概览</h4>
                    <p>${budgetStatus}</p>
                </div>
                <div class="analysis-section">
                    <h4>💡 智能建议</h4>
                    <ul class="tips-list">
                        ${tips.map(tip => `<li>${tip}</li>`).join('')}
                    </ul>
                </div>
                <div class="chart-container">
                    <div class="pie-chart">
                        <canvas id="spendingChart"></canvas>
                    </div>
                    <div class="chart-legend">
                        ${categoryStats.filter(c => c.spent > 0).map(c => `
                            <div class="legend-item">
                                <div class="legend-color" style="background: ${c.color}"></div>
                                <span class="legend-text">${c.icon} ${c.name}: ${formatCurrency(c.spent)}</span>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function drawPieChart(categoryStats) {
            const canvas = document.getElementById('spendingChart');
            if (!canvas) return;
            
            const ctx = canvas.getContext('2d');
            const size = 250;
            canvas.width = size;
            canvas.height = size;
            
            const centerX = size / 2;
            const centerY = size / 2;
            const radius = size / 2 - 20;

            const total = categoryStats.reduce((sum, c) => sum + c.spent, 0);
            if (total === 0) {
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
                ctx.fillStyle = '#e0e0e0';
                ctx.fill();
                ctx.fillStyle = '#999';
                ctx.font = '14px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('暂无消费数据', centerX, centerY);
                return;
            }

            let startAngle = -Math.PI / 2;
            
            categoryStats.forEach(cat => {
                if (cat.spent > 0) {
                    const sliceAngle = (cat.spent / total) * 2 * Math.PI;
                    
                    ctx.beginPath();
                    ctx.moveTo(centerX, centerY);
                    ctx.arc(centerX, centerY, radius, startAngle, startAngle + sliceAngle);
                    ctx.closePath();
                    ctx.fillStyle = cat.color;
                    ctx.fill();
                    
                    startAngle += sliceAngle;
                }
            });

            ctx.beginPath();
            ctx.arc(centerX, centerY, radius * 0.5, 0, 2 * Math.PI);
            ctx.fillStyle = 'white';
            ctx.fill();

            ctx.fillStyle = '#333';
            ctx.font = 'bold 16px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(formatCurrency(total), centerX, centerY);
        }

        initData();
        renderCategories();
        updateSummary();
        renderAnalysis();
    </script>
</body>
</html>
